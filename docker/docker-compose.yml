services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  auth-db:
    image: postgres:15
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5431:5432"

  product-db:
    image: postgres:15
    container_name: product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  order-db:
    image: postgres:15
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"

  cart-db:
    image: postgres:15
    container_name: cart-db
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"

  payment-db:
    image: postgres:15
    container_name: payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"

  seller-db:
    image: postgres:15
    container_name: seller-db
    environment:
      POSTGRES_DB: seller_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"

  campaign-db:
    image: postgres:15
    container_name: campaign-db
    environment:
      POSTGRES_DB: campaign_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5437:5432"

  discovery-server:
    build:
      context: ..
      dockerfile: Dockerfile.spring
      args:
        MODULE: discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"

  auth-service:
    build:
      context: ..
      dockerfile: Dockerfile.spring
      args:
        MODULE: auth-service
    container_name: auth-service
    depends_on:
      - discovery-server
      - auth-db
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      DB_USERNAME: user
      DB_PASSWORD: password
    ports:
      - "8085:8085"

  product-service:
    build:
      context: ..
      dockerfile: Dockerfile.spring
      args:
        MODULE: product-service
    container_name: product-service
    depends_on:
      - discovery-server
      - product-db
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      PRODUCT_DB_URL: jdbc:postgresql://product-db:5432/product_db
      DB_USERNAME: user
      DB_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"

  cart-service:
    build:
      context: ..
      dockerfile: Dockerfile.spring
      args:
        MODULE: cart-service
    container_name: cart-service
    depends_on:
      - discovery-server
      - cart-db
      - campaign-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      CART_DB_URL: jdbc:postgresql://cart-db:5432/cart_db
      DB_USERNAME: user
      DB_PASSWORD: password
    ports:
      - "8082:8082"

  order-service:
    build:
      context: ..
      dockerfile: Dockerfile.spring
      args:
        MODULE: order-service
    container_name: order-service
    depends_on:
      - discovery-server
      - order-db
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      ORDER_DB_URL: jdbc:postgresql://order-db:5432/order_db
      DB_USERNAME: user
      DB_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"

  payment-service:
    build:
      context: ..
      dockerfile: Dockerfile.spring
      args:
        MODULE: payment-service
    container_name: payment-service
    depends_on:
      - discovery-server
      - payment-db
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      PAYMENT_DB_URL: jdbc:postgresql://payment-db:5432/payment_db
      DB_USERNAME: user
      DB_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8084:8084"

  seller-service:
    build:
      context: ..
      dockerfile: Dockerfile.spring
      args:
        MODULE: seller-service
    container_name: seller-service
    depends_on:
      - discovery-server
      - seller-db
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://seller-db:5432/seller_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8086:8086"

  campaign-service:
    build:
      context: ..
      dockerfile: Dockerfile.spring
      args:
        MODULE: campaign-service
    container_name: campaign-service
    depends_on:
      - discovery-server
      - campaign-db
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://campaign-db:5432/campaign_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8087:8087"

  api-gateway:
    build:
      context: ..
      dockerfile: Dockerfile.spring
      args:
        MODULE: api-gateway
    container_name: api-gateway
    depends_on:
      - discovery-server
      - auth-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - seller-service
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
      AUTH_SERVICE_URL: http://auth-service:8085
      PRODUCT_SERVICE_URL: http://product-service:8081
      CART_SERVICE_URL: http://cart-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      SELLER_SERVICE_URL: http://seller-service:8086
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3000:80"
