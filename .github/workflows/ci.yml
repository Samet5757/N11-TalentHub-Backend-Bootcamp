name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Backend compile/package (skip tests)
        run: mvn -B -ntp -DskipTests package

      - name: Critical service unit tests
        run: mvn -B -ntp -pl cart-service,order-service,payment-service,seller-service,campaign-service -am test

      - name: Order service integration test
        run: mvn -B -ntp -pl order-service -am -Dtest=OrderControllerIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Validate docker compose syntax
        run: docker compose -f docker/docker-compose.yml config >/tmp/compose-check.yml

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-and-test, frontend-build]
    if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master') }}
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prepare deployment bundle
        run: |
          mkdir -p /tmp/eb-bundle
          rsync -a --exclude '.git' --exclude 'frontend/node_modules' ./ /tmp/eb-bundle/
          cd /tmp/eb-bundle
          zip -r /tmp/source-bundle.zip .

      - name: Upload source bundle to S3
        run: |
          aws s3 cp /tmp/source-bundle.zip "s3://${{ secrets.EB_S3_BUCKET }}/source-bundle-${{ github.sha }}.zip"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ secrets.EB_APPLICATION_NAME }}" \
            --version-label "${{ github.sha }}" \
            --source-bundle S3Bucket="${{ secrets.EB_S3_BUCKET }}",S3Key="source-bundle-${{ github.sha }}.zip"

      - name: Update Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ secrets.EB_ENVIRONMENT_NAME }}" \
            --version-label "${{ github.sha }}"

  notify-slack:
    runs-on: ubuntu-latest
    if: always()
    needs: [build-and-test, frontend-build, deploy]

    steps:
      - name: Notify Slack (success)
        if: ${{ needs.build-and-test.result == 'success' && needs.frontend-build.result == 'success' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: good
          SLACK_TITLE: "CI Success"
          SLACK_MESSAGE: "Workflow '${{ github.workflow }}' succeeded for `${{ github.repository }}` on `${{ github.ref_name }}`. Commit: `${{ github.sha }}`"
          MSG_MINIMAL: true

      - name: Notify Slack (failure)
        if: ${{ needs.build-and-test.result != 'success' || needs.frontend-build.result != 'success' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: danger
          SLACK_TITLE: "CI Failure"
          SLACK_MESSAGE: "Workflow '${{ github.workflow }}' failed for `${{ github.repository }}` on `${{ github.ref_name }}`. Commit: `${{ github.sha }}`"
          MSG_MINIMAL: true

      - name: Notify Slack (deploy)
        if: ${{ needs.deploy.result == 'success' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: good
          SLACK_TITLE: "Deploy Success"
          SLACK_MESSAGE: "Deploy job succeeded on `${{ github.ref_name }}`. Commit: `${{ github.sha }}`"
          MSG_MINIMAL: true
