name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Backend compile/package (skip tests)
        run: mvn -B -ntp -DskipTests package

      - name: Critical service unit tests
        run: mvn -B -ntp -pl cart-service,order-service,payment-service -am test

      - name: Order service integration test
        run: mvn -B -ntp -pl order-service -am -Dtest=OrderControllerIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Validate docker compose syntax
        run: docker compose -f docker/docker-compose.yml config >/tmp/compose-check.yml

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Build
        run: npm run build

  notify-slack:
    runs-on: ubuntu-latest
    if: always()
    needs: [build-and-test, frontend-build]

    steps:
      - name: Notify Slack (success)
        if: ${{ needs.build-and-test.result == 'success' && needs.frontend-build.result == 'success' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: good
          SLACK_TITLE: "CI Success"
          SLACK_MESSAGE: "Workflow '${{ github.workflow }}' succeeded for `${{ github.repository }}` on `${{ github.ref_name }}`. Commit: `${{ github.sha }}`"
          MSG_MINIMAL: true

      - name: Notify Slack (failure)
        if: ${{ needs.build-and-test.result != 'success' || needs.frontend-build.result != 'success' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: danger
          SLACK_TITLE: "CI Failure"
          SLACK_MESSAGE: "Workflow '${{ github.workflow }}' failed for `${{ github.repository }}` on `${{ github.ref_name }}`. Commit: `${{ github.sha }}`"
          MSG_MINIMAL: true
