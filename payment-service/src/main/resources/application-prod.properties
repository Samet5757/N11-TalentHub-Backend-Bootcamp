server.port=${SERVER_PORT:8084}
spring.application.name=payment-service

spring.datasource.url=${PAYMENT_DB_URL:jdbc:postgresql://${RDS_HOST}:${DB_PORT:5432}/payment_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASS}}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.liquibase.url=${spring.datasource.url}
spring.liquibase.user=${SPRING_LIQUIBASE_USER:${SPRING_DATASOURCE_USERNAME:${DB_USER}}}
spring.liquibase.password=${SPRING_LIQUIBASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASS}}}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery-server:8761/eureka/}
eureka.instance.prefer-ip-address=true

iyzico.base-url=${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
iyzico.api-key=${IYZICO_API_KEY}
iyzico.secret-key=${IYZICO_SECRET_KEY}
payment.iyzipay.require-real=${PAYMENT_IYZIPAY_REQUIRE_REAL:true}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.common.event
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.listener.auto-startup=false
spring.kafka.admin.fail-fast=false
