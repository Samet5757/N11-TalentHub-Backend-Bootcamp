x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: prod
  EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://discovery-server:8761/eureka/}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
      args:
        MODULE: discovery-server
    container_name: discovery-server
    environment:
      <<: *common-env
      SERVER_PORT: 8761
    ports:
      - "8761:8761"

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
      args:
        MODULE: auth-service
    container_name: auth-service
    depends_on:
      - discovery-server
    environment:
      <<: *common-env
      SERVER_PORT: 8085
      DB_HOST: ${AUTH_DB_HOST}
      DB_PORT: ${AUTH_DB_PORT:-5432}
      DB_NAME: ${AUTH_DB_NAME:-auth_db}
      DB_USER: ${AUTH_DB_USER}
      DB_PASS: ${AUTH_DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8085:8085"

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
      args:
        MODULE: product-service
    container_name: product-service
    depends_on:
      - discovery-server
      - redis
      - kafka
    environment:
      <<: *common-env
      SERVER_PORT: 8081
      DB_HOST: ${PRODUCT_DB_HOST}
      DB_PORT: ${PRODUCT_DB_PORT:-5432}
      DB_NAME: ${PRODUCT_DB_NAME:-product_db}
      DB_USER: ${PRODUCT_DB_USER}
      DB_PASS: ${PRODUCT_DB_PASS}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_CACHE_TYPE: ${SPRING_CACHE_TYPE:-redis}
    ports:
      - "8081:8081"

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
      args:
        MODULE: cart-service
    container_name: cart-service
    depends_on:
      - discovery-server
      - campaign-service
    environment:
      <<: *common-env
      SERVER_PORT: 8082
      DB_HOST: ${CART_DB_HOST}
      DB_PORT: ${CART_DB_PORT:-5432}
      DB_NAME: ${CART_DB_NAME:-cart_db}
      DB_USER: ${CART_DB_USER}
      DB_PASS: ${CART_DB_PASS}
    ports:
      - "8082:8082"

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
      args:
        MODULE: order-service
    container_name: order-service
    depends_on:
      - discovery-server
      - kafka
    environment:
      <<: *common-env
      SERVER_PORT: 8083
      DB_HOST: ${ORDER_DB_HOST}
      DB_PORT: ${ORDER_DB_PORT:-5432}
      DB_NAME: ${ORDER_DB_NAME:-order_db}
      DB_USER: ${ORDER_DB_USER}
      DB_PASS: ${ORDER_DB_PASS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      ORDER_MAIL_ENABLED: ${ORDER_MAIL_ENABLED:-true}
    ports:
      - "8083:8083"

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
      args:
        MODULE: payment-service
    container_name: payment-service
    depends_on:
      - discovery-server
      - kafka
    environment:
      <<: *common-env
      SERVER_PORT: 8084
      DB_HOST: ${PAYMENT_DB_HOST}
      DB_PORT: ${PAYMENT_DB_PORT:-5432}
      DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      DB_USER: ${PAYMENT_DB_USER}
      DB_PASS: ${PAYMENT_DB_PASS}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
      IYZICO_API_KEY: ${IYZICO_API_KEY}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY}
      PAYMENT_IYZIPAY_REQUIRE_REAL: ${PAYMENT_IYZIPAY_REQUIRE_REAL:-true}
    ports:
      - "8084:8084"

  seller-service:
    build:
      context: .
      dockerfile: seller-service/Dockerfile
      args:
        MODULE: seller-service
    container_name: seller-service
    depends_on:
      - discovery-server
    environment:
      <<: *common-env
      SERVER_PORT: 8086
      DB_HOST: ${SELLER_DB_HOST}
      DB_PORT: ${SELLER_DB_PORT:-5432}
      DB_NAME: ${SELLER_DB_NAME:-seller_db}
      DB_USER: ${SELLER_DB_USER}
      DB_PASS: ${SELLER_DB_PASS}
    ports:
      - "8086:8086"

  campaign-service:
    build:
      context: .
      dockerfile: campaign-service/Dockerfile
      args:
        MODULE: campaign-service
    container_name: campaign-service
    depends_on:
      - discovery-server
    environment:
      <<: *common-env
      SERVER_PORT: 8087
      DB_HOST: ${CAMPAIGN_DB_HOST}
      DB_PORT: ${CAMPAIGN_DB_PORT:-5432}
      DB_NAME: ${CAMPAIGN_DB_NAME:-campaign_db}
      DB_USER: ${CAMPAIGN_DB_USER}
      DB_PASS: ${CAMPAIGN_DB_PASS}
    ports:
      - "8087:8087"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      args:
        MODULE: api-gateway
    container_name: api-gateway
    depends_on:
      - discovery-server
      - auth-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - seller-service
      - campaign-service
    environment:
      <<: *common-env
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8085}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://product-service:8081}
      CART_SERVICE_URL: ${CART_SERVICE_URL:-http://cart-service:8082}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://order-service:8083}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:8084}
      SELLER_SERVICE_URL: ${SELLER_SERVICE_URL:-http://seller-service:8086}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    depends_on:
      - api-gateway
    ports:
      - "3000:80"
