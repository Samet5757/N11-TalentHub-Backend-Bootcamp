server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - JwtAuthentication
      routes:
        - id: auth-service
          uri: http://localhost:8085
          predicates:
            - Path=/auth/**
        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/products/**
        - id: cart-service
          uri: http://localhost:8082
          predicates:
            - Path=/cart/**
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/orders/**
        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/payments/**
        - id: seller-service
          uri: http://localhost:8086
          predicates:
            - Path=/sellers/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

security:
  jwt:
    secret: ThisIsA32CharLongGatewayJwtSecret!
